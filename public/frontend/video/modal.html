<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Themes Menu Modal</title>

  <style>
    /* Fullscreen Modal Styling */
    .m-themes .m-content {
      background-color: #000;
      color: #fff;
      border: 0;
      position: relative;
      overflow: hidden;
    }

    /* Background Images Layer */
    .theme-bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      z-index: 1;
    }

    /* Dark Overlay for Readability */
    .m-themes .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2;
    }

    /* Content Layer */
    .m-themes .m-body {
      position: relative;
      z-index: 3;
    }

    /* Typography & Links */
    .theme-link {
      font-family: 'Times New Roman', Times, serif;
      font-size: 2.75rem;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      transition: color 0.3s ease, transform 0.3s ease;
      display: inline-block;
      position: relative;
    }

    /* Hover State Effect */
    .theme-link:hover {
      color: #ffffff;
    }

    /* Orange Bullet Indicator on Hover */
    .theme-link::before {
      content: '•';
      color: #ff6b35;
      position: absolute;
      left: -1.2em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .theme-link:hover::before {
      opacity: 1;
    }
  </style>
</head>

<body class="bg-dark p-5">

  <!-- Trigger Button -->
  <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#themesModal">
    Open Themes
  </button>

  <!-- Fullscreen Modal -->
  <div class="modal fade modal-themes m-themes" id="themesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content m-content">

        <!-- Background Image Layers for each Item -->
        <div id="bg-default" class="theme-bg-layer opacity-100" style="background-image: url('https://picsum.photos/id/1015/1920/1080');"></div>
        <div id="bg-1" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1018/1920/1080');"></div>
        <div id="bg-2" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1019/1920/1080');"></div>
        <div id="bg-3" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1025/1920/1080');"></div>
        <div id="bg-4" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1035/1920/1080');"></div>
        <div id="bg-5" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1039/1920/1080');"></div>
        <div id="bg-6" class="theme-bg-layer" style="background-image: url('https://picsum.photos/id/1043/1920/1080');"></div>

        <!-- Dark Tint Overlay -->
        <div class="overlay"></div>

        <!-- Header -->
        <div class="modal-header border-0 p-4 p-md-5 position-relative" style="z-index: 3;">
          <span class="text-uppercase fw-semibold tracking-wider small text-white-50">THEMES</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- Modal Body / Navigation Links -->
        <div class="modal-body m-body d-flex align-items-center justify-content-center  pb-5">
          <div class="d-flex flex-column gap-2">
            <div>
              <a href="#" class="theme-link" data-bg="bg-1">Climate & Energy</a>
            </div>
            <div>
              <a href="#" class="theme-link" data-bg="bg-2">Economic Prosperity</a>
            </div>
            <div>
              <a href="#" class="theme-link" data-bg="bg-3">Geopolitics & Security</a>
            </div>
            <div>
              <a href="#" class="theme-link" data-bg="bg-4">Politics & Governance</a>
            </div>
            <div>
              <a href="#" class="theme-link" data-bg="bg-5">Public Services</a>
            </div>
            <div>
              <a href="#" class="theme-link" data-bg="bg-6">Tech & Digitalisation</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Image Switching Script -->
  <script>
    const themeLinks = document.querySelectorAll('.theme-link');
    const bgLayers = document.querySelectorAll('.theme-bg-layer');
    const defaultBg = document.getElementById('bg-default');

    themeLinks.forEach(link => {
      link.addEventListener('mouseenter', () => {
        const targetId = link.getAttribute('data-bg');
        bgLayers.forEach(bg => bg.classList.remove('opacity-100'));
        document.getElementById(targetId).classList.add('opacity-100');
      });

      link.addEventListener('mouseleave', () => {
        bgLayers.forEach(bg => bg.classList.remove('opacity-100'));
        defaultBg.classList.add('opacity-100');
      });
    });
  </script>
</body>

</html>
